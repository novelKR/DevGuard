[package]
name = "devguard-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical local authority configuration and service boundary"

[[bin]]
name = "devguardd"
path = "src/main.rs"

[features]
# Isolated test authorities for workspace tests; never used by `devguardd`.
test-fixtures = []

[dependencies]
devguard-contract = { path = "../contract" }
devguard-core = { path = "../core" }
devguard-client = { path = "../client" }
devguard-macos = { path = "../macos" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
# The installer's integration tests serve isolated fixture authorities.
devguard-daemon = { path = ".", features = ["test-fixtures"] }
tempfile.workspace = true
