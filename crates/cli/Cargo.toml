[package]
name = "devguard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "DevGuard command-line owner: managed execution through the central authority, diagnostics and receipts"

[[bin]]
name = "devguard"
path = "src/main.rs"

[dependencies]
devguard-contract = { path = "../contract" }
devguard-client = { path = "../client" }
devguard-daemon = { path = "../daemon" }
devguard-cargo = { path = "../cargo" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
devguard-daemon = { path = "../daemon", features = ["test-fixtures"] }
tempfile.workspace = true
