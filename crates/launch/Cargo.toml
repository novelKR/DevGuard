[package]
name = "devguard-launch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "DevGuard launch helper: verifies scope, policy and authorization before the executable starts"

[[bin]]
name = "devguard-launch"
path = "src/main.rs"

[dependencies]
devguard-contract = { path = "../contract" }
devguard-client = { path = "../client" }
devguard-macos = { path = "../macos" }
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
devguard-daemon = { path = "../daemon", features = ["test-fixtures"] }
tempfile.workspace = true
rusqlite.workspace = true
