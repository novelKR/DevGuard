name: Contracts and service boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Select the qualification toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Contract regression and workspace validation
        run: python3 scripts/validate.py --output target/qualification/ci
      - name: Canonical authority functional checks
        run: python3 scripts/qualify.py dg1-authority --output target/qualification/dg1-authority
      - name: Native local authentication functional checks
        run: python3 scripts/qualify.py dg1-auth --output target/qualification/dg1-auth
      - name: Native host evidence functional checks
        if: runner.os == 'macOS'
        run: python3 scripts/qualify.py dg1-probes --output target/qualification/dg1-probes
      - name: Native scope and policy readback functional checks
        if: runner.os == 'macOS'
        # Hosted runners clamp every process, so the unclamped-root case can only
        # be recorded as not run there; the summary still shows incomplete.
        run: python3 scripts/qualify.py dg1-scopes --allow-incomplete --output target/qualification/dg1-scopes
      - name: Native launch helper functional checks
        if: runner.os == 'macOS'
        # The same clamp leaves the unclamped-helper refusal case not run there.
        run: python3 scripts/qualify.py dg1-launch --allow-incomplete --output target/qualification/dg1-launch
      - name: Native reconciliation functional checks
        if: runner.os == 'macOS'
        run: python3 scripts/qualify.py dg1-reconcile --output target/qualification/dg1-reconcile
      - name: Native command-line owner functional checks
        if: runner.os == 'macOS'
        run: python3 scripts/qualify.py dg1-cli --output target/qualification/dg1-cli
      - name: Native Cargo adapter functional checks
        if: runner.os == 'macOS'
        # Hosted runners' work capacity cannot fit one Cargo job (1 CPU and
        # 2 GiB), so real-build cases are recorded not run there; refusals still run.
        run: python3 scripts/qualify.py dg1-cargo --allow-incomplete --output target/qualification/dg1-cargo
      - name: Native installation functional checks
        if: runner.os == 'macOS'
        # Transient launchd jobs need the user's gui domain; a runner without
        # one records the launchd case not run, and the summary shows incomplete.
        run: python3 scripts/qualify.py dg1-bootstrap --allow-incomplete --output target/qualification/dg1-bootstrap
      - name: Native parent lease and candidate functional checks
        if: runner.os == 'macOS'
        run: python3 scripts/qualify.py dg1-self-use --output target/qualification/dg1-self-use
      - name: Native upgrade and repair functional checks
        if: runner.os == 'macOS'
        run: python3 scripts/qualify.py dg1-upgrade --output target/qualification/dg1-upgrade
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dg0-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/qualification/
          if-no-files-found: error
      - name: Summarize qualification
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for name in ['ci', 'dg1-authority', 'dg1-auth', 'dg1-probes', 'dg1-scopes', 'dg1-launch', 'dg1-reconcile', 'dg1-cli', 'dg1-cargo', 'dg1-bootstrap', 'dg1-self-use', 'dg1-upgrade']:
                  path = Path('target/qualification') / name / 'report.json'
                  status = json.loads(path.read_text())['status'] if path.exists() else 'not_run'
                  out.write(name + ': ' + status + '\n\n')
              out.write('Contract regression, service/UDS, native host evidence, native scope, launch helper, reconciliation, command-line owner, Cargo adapter, installation, parent lease, upgrade and repair functional checks only; native suites run on macOS. Real self-use under an installed parent and foreground SLO qualification are not run.\n')
          PY
