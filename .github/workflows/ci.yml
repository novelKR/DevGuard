name: Contracts and service boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Select the qualification toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Contract regression and workspace validation
        run: python3 scripts/validate.py --output target/qualification/ci
      - name: Canonical authority functional checks
        run: python3 scripts/qualify.py dg1-authority --output target/qualification/dg1-authority
      - name: Native local authentication functional checks
        run: python3 scripts/qualify.py dg1-auth --output target/qualification/dg1-auth
      - name: Native host evidence functional checks
        if: runner.os == 'macOS'
        run: python3 scripts/qualify.py dg1-probes --output target/qualification/dg1-probes
      - name: Native scope and policy readback functional checks
        if: runner.os == 'macOS'
        # Hosted runners clamp every process, so the unclamped-root case can only
        # be recorded as not run there; the summary still shows incomplete.
        run: python3 scripts/qualify.py dg1-scopes --allow-incomplete --output target/qualification/dg1-scopes
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dg0-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/qualification/
          if-no-files-found: error
      - name: Summarize qualification
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for name in ['ci', 'dg1-authority', 'dg1-auth', 'dg1-probes', 'dg1-scopes']:
                  path = Path('target/qualification') / name / 'report.json'
                  status = json.loads(path.read_text())['status'] if path.exists() else 'not_run'
                  out.write(name + ': ' + status + '\n\n')
              out.write('Contract regression, service/UDS, native host evidence and native scope functional checks only; native suites run on macOS. Workload launch, self-use and foreground SLO qualification are not run.\n')
          PY
