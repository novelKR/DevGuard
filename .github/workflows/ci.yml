name: Contracts and service boundary

# Pull requests and pushes to main run the checks their changed paths can affect, as
# scripts/ci-policy.json classifies them. Unknown paths, CI, planning, qualification, Cargo and
# toolchain inputs, and a missing or untrusted base run everything. The daily scheduled run and
# every manual run are always full: they are the compensating control that keeps qualifying the
# whole repository on both platforms, every native suite included, now that pull requests and
# main pushes run only affected checks. "Required checks" passes only when this run and attempt
# did exactly what its plan requires.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its running checks, and the replaced run's gate
  # fails; main, scheduled and manual runs always complete.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the CI policy
        run: python3 -B -m unittest discover -s scripts -p 'test_ci_*.py'
      - id: plan
        name: Plan affected checks
        run: python3 -B scripts/ci_plan.py
      - name: Preserve the plan
        uses: actions/upload-artifact@v6
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: target/ci/plan/
          if-no-files-found: error

  repository:
    name: Repository checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whitespace and planned non-Rust validation
        run: python3 -B scripts/ci_run.py repository
      - name: Preserve repository evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-repository-${{ github.run_attempt }}
          path: target/ci/repository/
          if-no-files-found: error

  contracts:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CI_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Bind this job to the plan
        run: python3 -B scripts/ci_run.py bind contracts --os "$CI_OS"
      - name: Select the qualification toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Contract regression and workspace validation
        run: python3 scripts/validate.py --output target/qualification/ci
      - name: Planned functional checks
        # The suites, their order and the hosted-runner exceptions for incomplete suites come
        # from scripts/ci-policy.json ("suites" and "allowances").
        run: python3 -B scripts/ci_run.py contracts --os "$CI_OS"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dg0-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/qualification/
          if-no-files-found: error
      - name: Summarize qualification
        if: always()
        run: python3 -B scripts/ci_run.py summary --os "$CI_OS"

  required:
    name: Required checks
    # Never skipped: it proves that the planned jobs passed with evidence from this attempt and
    # that the others were skipped.
    if: ${{ always() }}
    needs: [plan, repository, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's evidence
        # Every artifact of this run, each in a directory named after it (a lone artifact is
        # unpacked in place and so matches no expected name). A missing artifact fails the
        # check below, not this download.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          path: target/ci-artifacts
      - name: Require the planned checks
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 -B scripts/check_ci_results.py --artifacts target/ci-artifacts
