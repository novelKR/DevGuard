[workspace]
resolver = "2"
members = ["crates/contract", "crates/core", "crates/daemon", "crates/client", "crates/macos", "crates/launch", "crates/cli", "crates/cargo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
repository = "https://github.com/novelKR/DevGuard"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.27"
uuid = { version = "1.20", features = ["v4"] }
libc = "0.2"
toml = "=0.9.12"

[profile.dev]
debug = 1
